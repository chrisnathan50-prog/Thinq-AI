<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thinq Explainer</title>
<meta name="viewport" content="width=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&display=block" rel="stylesheet">
<style>
/* Thinq tokens (thinq-app/public/base.css) + the promo's visual language */
:root{
  --ink:#0b0b0c; --ink2:#3a3a3d; --muted:#6e6e76; --soft:#b1b1b6; --line:#ececee;
  --violet:#7a5cff; --pink:#f7b6d2; --lilac:#c9b6ff; --blue:#a9cdfd; --peach:#ffd9b8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:Geist,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.012em}
#stage{position:absolute;inset:0;overflow:hidden;background:#f6f2ff}
.abs{position:absolute;left:0;top:0;transform-origin:50% 50%}
.layer{position:absolute;inset:0}
#world{position:absolute;inset:0;perspective:2400px;perspective-origin:50% 55%}

/* light field */
.blob{position:absolute;border-radius:50%;filter:blur(110px)}
#dark{position:absolute;inset:0;background:#0b0b0c;opacity:0}

/* glossy 3D app tiles */
.tile{position:absolute;left:0;top:0;border-radius:28%;display:grid;place-items:center}
.tile .face{position:absolute;inset:0;border-radius:inherit;overflow:hidden;
  box-shadow:inset 0 3px 1px rgba(255,255,255,.6), inset 0 -10px 18px rgba(0,0,0,.16), 0 10px 0 -1px var(--edge,#0003), 0 34px 44px -18px rgba(40,20,90,.55)}
.tile .face::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 25% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 55%)}
.tile svg.g{position:relative;width:52%;height:52%;z-index:1}
.tile .cal{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;line-height:1}
.tile .cal small{font-weight:600;color:#ff3b30;font-size:.15em;letter-spacing:.04em}
.tile .cal b{font-weight:400;font-size:.42em;letter-spacing:-.04em;color:#111;margin-top:.04em}
.tile .badge{position:absolute;right:-6%;top:-6%;min-width:30%;height:30%;padding:0 8%;border-radius:999px;background:#ff3b30;color:#fff;
  display:grid;place-items:center;font-weight:600;font-size:.17em;z-index:2;box-shadow:0 4px 10px rgba(255,59,48,.4);font-variant-numeric:tabular-nums}

/* glass notification */
.nc{position:absolute;left:0;top:0;width:720px;padding:28px 32px 30px;border-radius:42px;background:rgba(255,255,255,.74);
  backdrop-filter:blur(30px) saturate(1.7);-webkit-backdrop-filter:blur(30px) saturate(1.7);
  border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 30px 60px -26px rgba(40,20,90,.42)}
.nc .hd{display:flex;align-items:center;gap:14px;font-weight:500;font-size:24px;color:var(--muted)}
.mi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;overflow:hidden;position:relative}
.mi svg{width:26px;height:26px}
.nc .hd time{margin-left:auto;font-size:22px}
.nc .tt{font-weight:600;font-size:33px;letter-spacing:-.025em;margin-top:16px}
.nc .bd{font-size:29px;line-height:1.3;color:var(--ink2);margin-top:6px;letter-spacing:-.015em}

/* logo mark dots */
#mk{position:absolute;left:240px;top:780px;width:600px;height:600px}
#mk i{position:absolute;border-radius:50%;background:var(--violet)}
#icon{position:absolute;left:0;top:0;border-radius:24%;background:linear-gradient(160deg,#2c2c31,#0b0b0c 60%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.18),0 50px 90px -30px rgba(80,40,200,.65)}

/* phone */
#phone{position:absolute;left:270px;top:560px;width:540px;height:1090px;border-radius:92px;
  background:linear-gradient(145deg,#55555a,#1c1c1f 38%,#2d2d31);box-shadow:inset 0 0 0 3px #66666b,0 70px 120px -40px rgba(40,20,90,.7);padding:13px}
#scr{position:relative;width:100%;height:100%;border-radius:80px;overflow:hidden;background:#0d0d0f;color:#fff}
#isl{position:absolute;left:50%;top:18px;width:150px;height:42px;margin-left:-75px;border-radius:22px;background:#000;z-index:5}
#scr .st{position:absolute;left:50px;top:24px;font-weight:600;font-size:26px}
#scr .hi{position:absolute;left:40px;top:110px;font-weight:500;font-size:50px;letter-spacing:-.04em}
#scr .sub{position:absolute;left:40px;top:176px;font-size:25px;color:#8d8d94}
#ub{position:absolute;right:30px;top:262px;padding:20px 28px;border-radius:34px 34px 10px 34px;background:var(--violet);font-weight:500;font-size:29px;letter-spacing:-.02em}
#rp{position:absolute;left:30px;right:30px;top:380px}
#rp .rh{display:flex;align-items:center;gap:12px;font-weight:500;font-size:26px;color:#cfcfd6;margin-bottom:18px}
#rp .rh svg{width:28px;height:28px;color:var(--lilac)}
.rw{display:flex;align-items:center;gap:20px;padding:22px 24px;border-radius:26px;background:#1b1b1f;margin-bottom:12px}
.rw .tm{font-weight:500;font-size:23px;color:#8d8d94;width:74px;font-variant-numeric:tabular-nums}
.rw .nm{flex:1;font-weight:500;font-size:28px;letter-spacing:-.02em;line-height:1.2}
.rw .nm small{display:block;font-weight:400;font-size:22px;color:#8d8d94;margin-top:4px}
.rw .tg{font-weight:500;font-size:20px;padding:9px 14px;border-radius:16px;background:rgba(122,92,255,.22);color:#cbbdff}
#cmp{position:absolute;left:24px;right:24px;bottom:28px;height:94px;border-radius:47px;background:#1c1c20;display:flex;align-items:center;padding:0 16px 0 32px;font-size:28px}
#cmp .ph{color:#8d8d94}
#cmp .ct{display:inline-block;width:3px;height:34px;background:var(--lilac);margin-left:3px;vertical-align:-6px}
#cmp .sd{margin-left:auto;width:62px;height:62px;border-radius:31px;background:#fff;display:grid;place-items:center}
#dots{position:absolute;left:30px;top:380px;display:flex;gap:9px;padding:22px 26px;border-radius:10px 30px 30px 30px;background:#1b1b1f}
#dots i{width:13px;height:13px;border-radius:7px;background:#8d8d94}

/* glass cards */
.gc{position:absolute;left:0;top:0;width:880px;padding:40px;border-radius:50px;background:rgba(255,255,255,.8);backdrop-filter:blur(34px) saturate(1.6);
  -webkit-backdrop-filter:blur(34px) saturate(1.6);border:1px solid rgba(255,255,255,.8);
  box-shadow:inset 0 1px 0 #fff,0 60px 110px -40px rgba(40,20,90,.6)}
.gc .hd{display:flex;align-items:center;gap:16px}
.gc .hd b{font-weight:600;font-size:38px;letter-spacing:-.03em}
.gc .pill{margin-left:auto;font-weight:500;font-size:22px;color:#5a3fd6;background:#efeaff;padding:12px 18px;border-radius:20px}
.gc .meta{margin-top:26px;padding-bottom:22px;border-bottom:1px solid rgba(11,11,12,.08);font-size:27px;color:var(--muted)}
.gc .meta em{font-style:normal;color:var(--ink);font-weight:500}
.gc .body{margin-top:24px;font-size:34px;line-height:1.38;letter-spacing:-.02em;color:var(--ink2)}
.gc .bars{margin:24px 0 34px;display:flex;flex-direction:column;gap:14px}
.gc .bars i{height:14px;border-radius:7px;background:rgba(11,11,12,.07)}
.gc .btns{display:flex;justify-content:flex-end;gap:16px}
.btn{height:90px;padding:0 44px;border-radius:45px;font-weight:500;font-size:31px;display:flex;align-items:center;justify-content:center;gap:12px}
.btn.gh{border:1px solid rgba(11,11,12,.12);color:var(--ink2)}
#send{position:relative;overflow:hidden;min-width:200px;color:#fff;background:linear-gradient(180deg,#2a2a2e,#0b0b0c)}
#send .ok{position:absolute;inset:0;background:linear-gradient(180deg,#8d74ff,#6a4cf0);display:flex;align-items:center;justify-content:center;gap:10px}
#inv{width:720px;padding:30px 34px}
#inv .hd b{font-size:30px}

/* routine */
.tog{width:118px;height:70px;border-radius:35px;background:rgba(11,11,12,.12);position:relative;flex:none;margin-left:auto}
.tog i{position:absolute;left:6px;top:6px;width:58px;height:58px;border-radius:29px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.sun{width:96px;height:96px;border-radius:48px;background:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -12px rgba(160,90,20,.4);flex:none}

/* touch */
#tap{width:92px;height:92px;border-radius:46px;background:rgba(255,255,255,.55);border:3px solid rgba(255,255,255,.95);
  box-shadow:0 10px 30px rgba(40,20,90,.35)}
#ring{width:120px;height:120px;border-radius:60px;border:4px solid var(--violet)}

/* end */
#end-mark{position:absolute;left:390px;top:640px;width:300px;height:300px;color:#fff}
#end-wm{position:absolute;left:0;width:1080px;top:1030px;text-align:center;color:#fff;font-weight:600;font-size:150px;letter-spacing:-.055em;line-height:1}
#end-tg{position:absolute;left:0;width:1080px;top:1210px;text-align:center;color:#c4c4cc;font-weight:400;font-size:56px;letter-spacing:-.03em}
#end-cta{position:absolute;left:290px;top:1390px;width:500px;height:120px;border-radius:60px;background:#fff;color:var(--ink);
  font-weight:500;font-size:40px;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:0 18px 40px -16px rgba(0,0,0,.6)}

/* chrome */
#brand{left:390px;top:96px;width:300px;height:72px;border-radius:36px;display:flex;align-items:center;justify-content:center;gap:14px;
  background:rgba(255,255,255,.62);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.8);
  font-weight:600;font-size:30px;letter-spacing:-.025em;box-shadow:0 10px 30px -14px rgba(40,20,90,.35)}
#brand svg{width:34px;height:34px}
#chap{left:84px;top:1736px;width:912px;display:flex;gap:10px}
.cp{position:relative;flex:1;height:62px;border-radius:18px;background:rgba(255,255,255,.6);overflow:hidden;display:grid;place-items:center;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.7)}
.cp .f{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(122,92,255,.15),rgba(122,92,255,.95))}
.cp span{position:relative;font-weight:500;font-size:22px;color:var(--ink2)}
.hl{left:96px;top:226px;width:900px;font-weight:500;font-size:98px;line-height:1.04;letter-spacing:-.05em}
.hl .ln{display:block;white-space:nowrap}
.hl .w{display:inline-block;margin-right:.24em}
.hl .w.v{color:var(--violet)}
.hl .ln.m{color:#6e6e76}
#grain{position:absolute;inset:0;width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.16;pointer-events:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="mark" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="12" cy="3" r="2"/><circle cx="12" cy="21" r="2"/><circle cx="3" cy="12" r="2"/><circle cx="21" cy="12" r="2"/><circle cx="5.6" cy="5.6" r="1.7"/><circle cx="18.4" cy="5.6" r="1.7"/><circle cx="5.6" cy="18.4" r="1.7"/><circle cx="18.4" cy="18.4" r="1.7"/><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="7.5" r="1.5"/><circle cx="12" cy="16.5" r="1.5"/><circle cx="7.5" cy="12" r="1.5"/><circle cx="16.5" cy="12" r="1.5"/></g></symbol>
  <symbol id="g-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="3" fill="none" stroke="#fff" stroke-width="2"/><path d="m4.5 7.5 7.5 5.5 7.5-5.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="g-wa" viewBox="0 0 24 24"><path d="M12 3.2a8.8 8.8 0 0 0-7.6 13.2L3.3 20.7l4.4-1.1A8.8 8.8 0 1 0 12 3.2z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M9 8.2c.3-.6.6-.6.9-.6h.6c.2 0 .4 0 .6.5l.7 1.7c.1.3 0 .5-.1.7l-.5.6c-.2.2-.2.4 0 .7.6 1 1.5 1.8 2.6 2.3.3.1.5.1.7-.1l.6-.7c.2-.3.5-.3.8-.2l1.6.8c.3.1.4.3.4.5 0 .9-.6 1.7-1.6 1.9-1 .2-2.7-.2-4.6-1.8-1.6-1.4-2.6-3-2.7-4.3-.1-.9.2-1.6.5-2z" fill="#fff"/></symbol>
  <symbol id="g-tg" viewBox="0 0 24 24"><path d="M20.5 4.5 3.5 11.2c-.9.4-.9 1 0 1.2l4.3 1.4 1.6 5c.2.6.5.7 1 .3l2.4-2 4.6 3.4c.8.5 1.3.2 1.5-.7l2.9-13.7c.3-1.2-.4-1.7-1.3-1.3z" fill="#fff"/><path d="m8 13.7 9-5.8-6.9 6.8" fill="none" stroke="#3aa6e0" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  <symbol id="g-sun" viewBox="0 0 24 24"><path d="M6 15a6 6 0 0 1 12 0z" fill="#ff9f0a"/><path d="M4 17.5h16" stroke="#1d1d1f" stroke-width="1.8" stroke-linecap="round"/><path d="M12 5v2.6M5.6 8.2l1.8 1.6M18.4 8.2l-1.8 1.6M3 13h2M19 13h2" stroke="#ff9f0a" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>

<div id="stage">
  <div class="layer" id="bg"></div>
  <div id="dark"></div>
  <div class="layer" id="glows"></div>
  <div id="world"></div>
  <div class="abs" id="brand"><svg><use href="#mark"/></svg>Thinq AI</div>
  <div class="abs" id="chap"></div>
  <div class="layer" id="hls"></div>
  <canvas id="grain" width="540" height="960"></canvas>
</div>

<script>
// =============================== timing ===============================
const DUR = 20.4, S = [0, 3.6, 6.6, 10.2, 14.4, 17.4, DUR];   // cuts on a 100 BPM grid

// =============================== easing ===============================
function bez(x1,y1,x2,y2){const A=(a,b)=>1-3*b+3*a,B=(a,b)=>3*b-6*a,C=a=>3*a,f=(t,a,b)=>((A(a,b)*t+B(a,b))*t+C(a))*t,d=(t,a,b)=>3*A(a,b)*t*t+2*B(a,b)*t+C(a);
  return x=>{if(x<=0)return 0;if(x>=1)return 1;let t=x;for(let i=0;i<8;i++){const s=d(t,x1,x2);if(Math.abs(s)<1e-6)break;t-=(f(t,x1,x2)-x)/s;}return f(t,y1,y2);};}
const OUT=bez(.16,1,.3,1), IO=bez(.7,0,.3,1), IN=bez(.6,0,.9,.4), POP=bez(.3,1.5,.55,1), SOFT=bez(.25,.1,.25,1);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), P=(t,a,b)=>cl((t-a)/(b-a)), L=(a,b,k)=>a+(b-a)*k;
const $=id=>document.getElementById(id);
const set=(el,o)=>{for(const k in o)el.style[k]=o[k];};
const vis=(el,on)=>{el.style.display=on?'':'none';};
function mk(html,parent){const d=document.createElement('div');d.innerHTML=html.trim();const e=d.firstChild;(parent||$('world')).appendChild(e);return e;}
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);}   // seeded: frames are pure functions of time
const tf3=({x=0,y=0,z=0,s=1,rx=0,ry=0,rz=0})=>`translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;

// =============================== light field ===============================
const PAL = [ // four blobs, colour per shot
  ['#ffd0e4','#ffd9b8','#ffc8d6','#e8d6ff'],
  ['#e6d8ff','#f7c9e4','#c8dcff','#d4c6ff'],
  ['#e9e1ff','#f9d3ea','#c6dbff','#cbbcff'],
  ['#efe6ff','#fbd6e9','#cfe0ff','#c9b6ff'],
  ['#ffe2c4','#ffd2b0','#cfe0ff','#ffe7d0'],
  ['#ffe2c4','#ffd2b0','#cfe0ff','#ffe7d0'],
];
const BLOBS=[{x:.15,y:.18,s:1.0},{x:.9,y:.3,s:.9},{x:.2,y:.85,s:1.1},{x:.85,y:.95,s:1.0}];
BLOBS.forEach(b=>{b.el=mk('<div class="blob"></div>',$('bg'));});
function mixHex(a,b,k){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return `rgb(${A.map((v,i)=>Math.round(L(v,B[i],k))).join(',')})`;}
function drawBg(t){
  let si=0; while(si<5&&t>=S[si+1]) si++;
  const nx=Math.min(5,si+1), k=SOFT(P(t,S[si+1]-0.5,S[si+1]+0.3));
  BLOBS.forEach((b,i)=>{
    const x=b.x*1080+90*Math.sin(t*.35+i*1.7), y=b.y*1920+120*Math.cos(t*.28+i*2.1), r=900*b.s;
    set(b.el,{left:(x-r/2)+'px',top:(y-r/2)+'px',width:r+'px',height:r+'px',background:mixHex(PAL[si][i],PAL[nx][i],k)});
  });
  $('dark').style.opacity = IO(P(t,17.15,17.6));
}
// end-card glows rise on the dark stage
const GLOWS=[['#7a5cff',.22,1.0,1150],['#f7b6d2',.82,1.06,950],['#a9cdfd',.55,1.16,1050]].map(([c,x,y,r])=>({c,x,y,r,el:mk(`<div class="blob" style="background:${c}"></div>`,$('glows'))}));

// =============================== tiles ===============================
const TILE={
  mail:{bg:'linear-gradient(170deg,#7fd0ff,#1f7bf2)',edge:'#1557b8',g:'<svg class="g"><use href="#g-mail"/></svg>'},
  cal:{bg:'linear-gradient(170deg,#ffffff,#e9ebf2)',edge:'#b9bcc8',g:'<div class="cal"><small>TUE</small><b>18</b></div>'},
  wa:{bg:'linear-gradient(170deg,#6df59a,#1ab553)',edge:'#11823b',g:'<svg class="g"><use href="#g-wa"/></svg>'},
  tg:{bg:'linear-gradient(170deg,#6fd3fb,#1f8fd8)',edge:'#13649c',g:'<svg class="g"><use href="#g-tg"/></svg>'},
  thinq:{bg:'linear-gradient(170deg,#3a3a40,#0b0b0c)',edge:'#000',g:'<svg class="g" style="color:#fff"><use href="#mark"/></svg>'},
};
function tile(kind,size,badge,parent){
  const T=TILE[kind];
  const e=mk(`<div class="tile" style="width:${size}px;height:${size}px;font-size:${size}px;--edge:${T.edge}"><div class="face" style="background:${T.bg}"></div>${T.g}${badge?'<div class="badge">0</div>':''}</div>`,parent);
  e.badge=e.querySelector('.badge'); return e;
}
function mini(kind){const T=TILE[kind];const inner=kind==='cal'?'<b style="font-size:21px;font-weight:500;color:#111">18</b>':kind==='thinq'?'<svg style="color:#fff"><use href="#mark"/></svg>':T.g.replace('class="g"','');return `<span class="mi" style="background:${T.bg}">${inner}</span>`;}
function nc(kind,app,time,title,body,parent){
  return mk(`<div class="nc"><div class="hd">${mini(kind)}<span>${app}</span><time>${time}</time></div><div class="tt">${title}</div><div class="bd">${body}</div></div>`,parent);
}

// =============================== shot 1: the pile ===============================
const s1=mk('<div class="layer" id="s1"></div>');
const PILE=[
  {k:'tile',kind:'mail',t:0.06,x:96, y:640, sz:170,rz:-9, dot:0, n:[2,14]},
  {k:'nc',kind:'mail',app:'Mail',time:'now',tt:'Maya Chen',bd:'Can you sign off on the Q3 budget by 11?',t:0.32,x:230,y:690,rz:-3.5,dot:4},
  {k:'nc',kind:'mail',app:'Mail',time:'2m ago',tt:'Studio Nord',bd:'Invoice #2041 is due on Friday.',t:0.55,x:150,y:890,rz:2.8,dot:5},
  {k:'tile',kind:'cal',t:0.84,x:812,y:880,sz:170,rz:9,dot:2,n:[1,6]},
  {k:'nc',kind:'cal',app:'Calendar',time:'3:30 PM',tt:'Sync with Priya',bd:'Moved from 2:00 to 3:30.',t:1.06,x:110,y:1070,rz:-2,dot:6},
  {k:'nc',kind:'cal',app:'Calendar',time:'Thu',tt:'Design review',bd:'Thursday, 10:00 to 11:00',t:1.3,x:250,y:1246,rz:3.6,dot:7},
  {k:'tile',kind:'wa',t:1.64,x:70,y:1310,sz:170,rz:-10,dot:1,n:[4,27]},
  {k:'nc',kind:'wa',app:'WhatsApp',time:'now',tt:'Mum',bd:'Call me when you’re free x',t:1.86,x:200,y:1396,rz:-2.6,dot:3},
  {k:'nc',kind:'wa',app:'WhatsApp',time:'1m ago',tt:'Running club',bd:'Who’s in for Saturday at 8?',t:2.1,x:250,y:1540,rz:2.2,dot:8},
];

{const c=tileN.getContext('2d'),im=c.createImageData(256,256);for(let i=0;i<256*256;i++){const v=hash(i+.5)*255;im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=255;}c.putImageData(im,0,0);}

// =============================== render ===============================
function renderAt(t){

    const ex=IN(P(t,h.to-.24,h.to+.1));set(h.el,{transform:`translateY(${-60*ex}px)`,opacity:1-ex,filter:`blur(${10*ex}px)`});

  // shot 1 -> 2: the pile flies into the mark

  PILE.forEach((p,i)=>{
    const a=POP(P(t,p.t,p.t+.62)), o=P(t,p.t,p.t+.14);
    const jx=8*Math.sin(t*2.1+i*1.3), jy=8*Math.cos(t*1.7+i*2.2);
    let x=p.x+jx, y=p.y+jy+(1-a)*160, s=0.72+0.28*a, rz=p.rz*(0.3+0.7*a)-(1-a)*8, rx=(1-a)*40, op=o;
    const d=MD[p.dot], m=IO(P(t,p.arr-0.42,p.arr+0.3));
    const tx=MX+d[0]*U-p.w/2, ty=MY+d[1]*U-p.h/2, ts=(2*d[2]*U)/Math.max(p.w,p.h)*1.15;
    x=L(x,tx,m); y=L(y,ty,m); s=L(s,ts,m); rz=L(rz,0,m); op*=1-P(m,.72,1);
    set(p.el,{transform:tf3({x,y,s,rx,rz}),opacity:op,filter:m>0&&m<1?`blur(${Math.sin(Math.PI*m)*3}px)`:'none'});
    if(p.el.badge)p.el.badge.textContent=Math.round(L(p.n[0],p.n[1],OUT(P(t,p.t+.3,3.3))));
  });
  const mkOn=t>3.9&&t<7.0; vis(mkEl,mkOn); vis(icon,t>5.5&&t<7.4);
  const turn=IO(P(t,5.0,5.7)), shrink=IO(P(t,5.55,6.15));
  set(mkEl,{transform:`rotate(${45*turn}deg) scale(${L(1,0.5,shrink)})`,opacity:1-P(t,6.55,6.8)});
  MD.forEach((d,i)=>{const k=POP(P(t,ARR[i]-.05,ARR[i]+.35));set(d.el,{opacity:P(t,ARR[i]-.05,ARR[i]+.05),transform:`scale(${0.3+0.7*k})`,background:shrink>.5?'#ffffff':'#7a5cff'});});
  // the mark becomes the app icon; the icon opens into the phone
  const ic=OUT(P(t,5.6,6.2)), isz=L(120,520,ic), op3=IO(P(t,6.55,7.2));
  set(icon,{left:L(540-isz/2,283,op3)+'px',top:L(1080-isz/2,573,op3)+'px',width:L(isz,514,op3)+'px',height:L(isz,1064,op3)+'px',
    borderRadius:L(isz*.24,80,op3)+'px',opacity:P(t,5.6,5.75)*(1-P(t,7.15,7.35))});

  // phone
  vis(phone,t>6.9&&t<14.5);
  const phIn=P(t,6.95,7.2), back=IO(P(t,10.2,10.9)), phOut=IN(P(t,13.9,14.4)), tilt=OUT(P(t,7.1,8.5));
  set(phone,{opacity:phIn*(1-phOut),
    transform:`perspective(2400px) translateY(${Math.sin(t*1.1)*10+60*back+80*phOut}px) rotateY(${-12*tilt+4*back}deg) rotateX(${5*tilt}deg) scale(${1-0.12*back})`,
    filter:back>0?`blur(${7*back}px) brightness(${1-0.25*back})`:'none'});
  const TY='Plan my day', typed=Math.floor(TY.length*P(t,7.25,7.95)), sent=t>=8.05;
  $('ctx').textContent=sent?'':TY.slice(0,typed); vis($('cph'),sent||typed===0); vis($('ct'),!sent&&t>7.15);
  $('csd').style.transform=`scale(${1-0.14*Math.sin(Math.PI*P(t,7.95,8.12))})`;
  const hiOut=OUT(P(t,8.05,8.4)); set($('hi'),{opacity:1-hiOut}); set($('sub'),{opacity:1-hiOut});
  const ub=OUT(P(t,8.05,8.45)); set($('ub'),{opacity:ub,transform:`translateY(${40*(1-ub)}px) scale(${.9+.1*ub})`,transformOrigin:'100% 100%'});
  set($('dots'),{opacity:P(t,8.3,8.4)*(1-P(t,8.75,8.85))});

  const up=OUT(P(t,10.28,11.05)), fly=IN(P(t,13.62,14.2));

  let tx=1200,ty=1700,to=0,ts=1;
  // measured from layout (cards are untransformed at their resting pose)
  const ctr=(el,ox,oy)=>{let x=el.offsetWidth/2,y=el.offsetHeight/2;for(let e=el;e&&e!==$('world');e=e.offsetParent){x+=e.offsetLeft;y+=e.offsetTop;}return[x+ox,y+oy];};
  const [sx,sy]=ctr($('send'),100,800);
  if(t>12.1&&t<13.7){const k=IO(P(t,12.15,12.95));tx=L(960,sx,k);ty=L(1650,sy,k);to=P(t,12.1,12.3)*(1-P(t,13.35,13.6));ts=1-0.25*Math.sin(Math.PI*P(t,12.98,13.2));}
  const [tgx,tgy]=ctr($('tog'),100,620);
  if(t>14.7&&t<15.85){const k=IO(P(t,14.75,15.12));tx=L(980,tgx,k);ty=L(1500,tgy,k);to=P(t,14.7,14.85)*(1-P(t,15.5,15.8));ts=1-0.25*Math.sin(Math.PI*P(t,15.12,15.32));}
  set(tap,{opacity:to,transform:`translate(${tx-46}px,${ty-46}px) scale(${ts})`});
  $('send').style.transform=`scale(${1-.06*Math.sin(Math.PI*P(t,12.98,13.18))})`;
  set($('sok'),{transform:`translateY(${(1-OUT(P(t,13.08,13.4)))*100}%)`});
  const rg=P(t,13.06,13.7); set(ring,{opacity:(rg>0&&rg<1)?(1-rg):0,transform:`translate(${sx-60}px,${sy-60}px) scale(${.6+2.4*OUT(rg)})`});

  set(rt,{opacity:P(t,14.42,14.6)*(1-endOut),transform:'perspective(2400px) '+tf3({x:100,y:620+60*(1-ri)-60*endOut,rx:18*(1-ri),s:.94+.06*ri})});
  const on=IO(P(t,15.18,15.42)); $('togk').style.transform=`translateX(${48*on}px)`; $('tog').style.background=on>.5?'#34c759':'rgba(11,11,12,.12)';
  BRIEF.forEach((b,i)=>{vis(b.el,t>b.t-.05&&t<17.7);
    const k=OUT(P(t,b.t,b.t+.5)), depth=BRIEF.reduce((s,c,j)=>j>i?s+OUT(P(t,c.t,c.t+.5)):s,0);
