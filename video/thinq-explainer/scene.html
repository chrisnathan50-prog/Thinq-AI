<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thinq Explainer</title>
<meta name="viewport" content="width=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&display=block" rel="stylesheet">
<script src="voenv.js"></script>
<style>
/* Thinq tokens (thinq-app/public/base.css) + the visual language of the earlier promo and features videos */
:root{ --ink:#0b0b0c; --ink2:#3a3a3d; --muted:#6e6e76; --soft:#b1b1b6; --violet:#0b0b0c; --lilac:#c9c9cf; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f7f7f8}
body{font-family:Geist,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.012em}
#stage{position:absolute;inset:0;overflow:hidden;background:#f7f7f8}
#grid{position:absolute;inset:0;background:radial-gradient(circle,rgba(11,11,12,.13) 1.6px,transparent 2px) 0 0/36px 36px}
.abs{position:absolute;left:0;top:0}
.layer{position:absolute;inset:0}
#world{position:absolute;inset:0}
.blob{position:absolute;border-radius:50%;filter:blur(110px)}
#dark{position:absolute;inset:0;background:#0b0b0c;opacity:0}

/* ---------- liquid glass: SVG refraction (backdrop) + specular rim ---------- */
.lg{position:absolute;left:0;top:0;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.26),rgba(255,255,255,.06) 55%,rgba(255,255,255,.14));
  box-shadow:inset 2px 2px 1px -1px rgba(255,255,255,.95), inset -2px -2px 1px -1px rgba(255,255,255,.55),
    inset 0 0 0 1px rgba(255,255,255,.32), inset 0 -22px 34px -22px rgba(255,255,255,.55), 0 26px 56px -24px rgba(11,11,12,.42)}
.lg::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(90% 60% at 22% 0%,rgba(255,255,255,.45),rgba(255,255,255,0) 60%)}
.lg>*{position:relative;z-index:1}
.lg.dk{box-shadow:inset 2px 2px 1px -1px rgba(255,255,255,.8), inset -2px -2px 1px -1px rgba(255,255,255,.35), inset 0 0 0 1px rgba(255,255,255,.18), 0 30px 70px -30px rgba(0,0,0,.6);
  background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 55%,rgba(255,255,255,.08))}

/* glossy app tiles */
.tile{position:absolute;left:0;top:0;border-radius:28%;display:grid;place-items:center}
.tile .face{position:absolute;inset:0;border-radius:inherit;overflow:hidden;
  box-shadow:inset 0 3px 1px rgba(255,255,255,.6), inset 0 -10px 18px rgba(0,0,0,.16), 0 10px 0 -1px var(--edge,#0003), 0 34px 44px -18px rgba(11,11,12,.55)}
.tile .face::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 25% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 55%)}
.tile svg.g{position:relative;width:52%;height:52%;z-index:1}
.tile .cal{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;line-height:1}
.tile .cal small{font-weight:600;color:#0b0b0c;font-size:.15em;letter-spacing:.04em}
.tile .cal b{font-weight:400;font-size:.42em;letter-spacing:-.04em;color:#111;margin-top:.04em}
.tile .badge{position:absolute;right:-6%;top:-6%;min-width:30%;height:30%;padding:0 8%;border-radius:999px;background:#0b0b0c;color:#fff;
  display:grid;place-items:center;font-weight:600;font-size:.17em;z-index:2;box-shadow:0 4px 10px rgba(0,0,0,.3);font-variant-numeric:tabular-nums}

/* frosted cards */
.nc{position:absolute;left:0;top:0;width:720px;padding:28px 32px 30px;border-radius:42px;background:rgba(255,255,255,.74);
  backdrop-filter:blur(30px) saturate(1.7);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 30px 60px -26px rgba(11,11,12,.42)}
.nc .hd{display:flex;align-items:center;gap:14px;font-weight:500;font-size:24px;color:var(--muted)}
.mi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;overflow:hidden;position:relative}
.mi svg{width:26px;height:26px}
.nc .hd time{margin-left:auto;font-size:22px}
.nc .tt{font-weight:600;font-size:33px;letter-spacing:-.025em;margin-top:16px}
.nc .bd{font-size:29px;line-height:1.3;color:var(--ink2);margin-top:6px;letter-spacing:-.015em}
.gc{position:absolute;left:0;top:0;width:880px;padding:40px;border-radius:50px;background:rgba(255,255,255,.8);backdrop-filter:blur(34px) saturate(1.6);
  border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 0 #fff,0 60px 110px -40px rgba(11,11,12,.55)}
.gc .hd{display:flex;align-items:center;gap:16px}
.gc .hd b{font-weight:600;font-size:36px;letter-spacing:-.03em}
.pill{margin-left:auto;font-weight:500;font-size:22px;color:#3a3a3d;background:#f0f0f2;padding:12px 18px;border-radius:20px;white-space:nowrap}
.gc .meta{margin-top:24px;padding-bottom:20px;border-bottom:1px solid rgba(11,11,12,.08);font-size:27px;color:var(--muted)}
.gc .meta em{font-style:normal;color:var(--ink);font-weight:500}
.gc .body{margin-top:22px;font-size:33px;line-height:1.38;letter-spacing:-.02em;color:var(--ink2)}
.gc .btns{display:flex;justify-content:flex-end;gap:16px;margin-top:30px}
.btn{position:relative;overflow:hidden;height:88px;padding:0 42px;border-radius:44px;font-weight:500;font-size:30px;display:flex;align-items:center;justify-content:center;gap:12px;white-space:nowrap}
.btn.gh{border:1px solid rgba(11,11,12,.12);color:var(--ink2)}
.btn.pr{color:#fff;background:linear-gradient(180deg,#2a2a2e,#0b0b0c);min-width:200px}
.btn .ok{position:absolute;inset:0;background:linear-gradient(180deg,#2a2a2e,#0b0b0c);display:flex;align-items:center;justify-content:center;gap:10px;transform:translateY(100%)}

/* mark */
.mkbox{position:absolute;left:0;top:0}
.mkbox i{position:absolute;border-radius:50%;background:var(--violet)}
#icon{position:absolute;left:0;top:0;border-radius:24%;background:linear-gradient(160deg,#2c2c31,#0b0b0c 60%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.18),0 50px 90px -30px rgba(11,11,12,.55)}

/* phone */
#phone{position:absolute;left:270px;top:560px;width:540px;height:1090px;border-radius:92px;
  background:linear-gradient(145deg,#55555a,#1c1c1f 38%,#2d2d31);box-shadow:inset 0 0 0 3px #66666b,0 70px 120px -40px rgba(11,11,12,.7);padding:13px}
#scr{position:relative;width:100%;height:100%;border-radius:80px;overflow:hidden;background:#0d0d0f;color:#fff}
#isl{position:absolute;left:50%;top:18px;width:150px;height:42px;margin-left:-75px;border-radius:22px;background:#000;z-index:5}
#scr .st{position:absolute;left:50px;top:24px;font-weight:600;font-size:26px}
#scr .hi{position:absolute;left:40px;top:110px;font-weight:500;font-size:50px;letter-spacing:-.04em}
#scr .sub{position:absolute;left:40px;top:176px;font-size:25px;color:#8d8d94}
.ub{position:absolute;right:30px;padding:20px 28px;border-radius:34px 34px 10px 34px;background:#fff;color:#0b0b0c;font-weight:500;font-size:29px;letter-spacing:-.02em;white-space:nowrap}
#rp{position:absolute;left:30px;right:30px;top:380px}
#rp .rh{display:flex;align-items:center;gap:12px;font-weight:500;font-size:26px;color:#cfcfd6;margin-bottom:18px}
#rp .rh svg{width:28px;height:28px;color:#fff}
.rw{display:flex;align-items:center;gap:20px;padding:22px 24px;border-radius:26px;background:#1b1b1f;margin-bottom:12px}
.rw .tm{font-weight:500;font-size:23px;color:#8d8d94;width:74px;font-variant-numeric:tabular-nums}
.rw .nm{flex:1;font-weight:500;font-size:28px;letter-spacing:-.02em;line-height:1.2}
.rw .nm small{display:block;font-weight:400;font-size:22px;color:#8d8d94;margin-top:4px}
.rw .tg{font-weight:500;font-size:20px;padding:9px 14px;border-radius:16px;background:rgba(255,255,255,.14);color:#fff}
#cmp{position:absolute;left:24px;right:24px;bottom:28px;height:94px;border-radius:47px;background:#1c1c20;display:flex;align-items:center;padding:0 16px 0 32px;font-size:28px;white-space:nowrap}
#cmp .ph{color:#8d8d94}
#cmp .ct{display:inline-block;width:3px;height:34px;background:#fff;margin-left:3px;vertical-align:-6px}
#cmp .sd{margin-left:auto;width:62px;height:62px;border-radius:31px;background:#fff;display:grid;place-items:center;flex:none}
#dots{position:absolute;left:30px;top:380px;display:flex;gap:9px;padding:22px 26px;border-radius:10px 30px 30px 30px;background:#1b1b1f}
#dots i,.tdots i{width:13px;height:13px;border-radius:7px;background:#8d8d94}

/* calendar */
#cal{width:900px;height:1080px;padding:36px}
#cal .gh{position:absolute;left:106px;right:36px;top:118px;display:flex}
#cal .gh span{flex:1;text-align:center;font-weight:500;font-size:23px;color:var(--muted)}
#cal .gh span b{display:block;font-weight:600;font-size:32px;color:var(--ink);letter-spacing:-.03em;margin-top:4px}
.hr{position:absolute;left:36px;right:36px;height:1px;background:rgba(11,11,12,.07)}
.hr span{position:absolute;left:0;top:-13px;font-weight:500;font-size:20px;color:#8a8a92;font-variant-numeric:tabular-nums}
.busy{position:absolute;border-radius:16px;background:rgba(11,11,12,.06);border:1px solid rgba(11,11,12,.05);padding:10px 12px;font-size:19px;line-height:1.2;color:#6e6e76;overflow:hidden;transform-origin:50% 0}
#scan{position:absolute;top:188px;width:4px;height:850px;border-radius:2px;background:linear-gradient(180deg,rgba(11,11,12,0),#0b0b0c 20%,#0b0b0c 80%,rgba(11,11,12,0))}
#slotx{position:absolute;left:0;top:0;border-radius:16px;overflow:hidden;box-shadow:0 30px 70px -30px rgba(11,11,12,.55)}
#slotx .va{position:absolute;inset:0;background:linear-gradient(170deg,#2a2a2e,#0b0b0c)}
#slotx .wb{position:absolute;inset:0;background:rgba(255,255,255,.86);backdrop-filter:blur(30px)}
#slotx .sl{position:absolute;left:14px;top:8px;color:#fff;font-weight:600;font-size:20px;white-space:nowrap}
#slotx .cardin{position:absolute;left:0;top:0;width:800px;padding:36px 40px}

/* voice + docs */
#vc{width:820px;height:190px;border-radius:95px;display:flex;align-items:center;padding:0 40px 0 30px;gap:30px}
#mic{width:130px;height:130px;border-radius:65px;background:rgba(255,255,255,.9);display:grid;place-items:center;flex:none;box-shadow:0 10px 26px -10px rgba(11,11,12,.35)}
#wave{flex:1;height:120px;display:flex;align-items:center;gap:7px}
#wave i{flex:1;border-radius:5px;background:var(--violet);min-height:8px}
#vtime{font-weight:500;font-size:32px;color:var(--ink2);font-variant-numeric:tabular-nums;width:76px}
#tr{width:760px;padding:28px 34px;border-radius:40px 40px 40px 12px;background:rgba(255,255,255,.82);backdrop-filter:blur(24px);
  box-shadow:0 24px 50px -24px rgba(11,11,12,.4);font-size:33px;font-weight:500;letter-spacing:-.02em}
#tr small{display:block;font-size:22px;color:var(--muted);font-weight:500;margin-bottom:8px}
#doc{width:760px;padding:40px 44px;border-radius:30px;background:#fff;box-shadow:0 2px 0 rgba(11,11,12,.04),0 60px 100px -40px rgba(11,11,12,.55)}
#doc .fh{display:flex;align-items:center;gap:14px;font-weight:500;font-size:24px;color:var(--muted);padding-bottom:22px;border-bottom:1px solid #eee}
#doc .pdf{width:48px;height:56px;border-radius:10px;background:linear-gradient(170deg,#3a3a40,#0b0b0c);color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center}
#doc h3{font-weight:600;font-size:38px;letter-spacing:-.03em;margin:28px 0 18px}
#doc p{font-size:28px;line-height:1.5;color:var(--ink2);letter-spacing:-.01em;margin-bottom:16px}
#doc .bar{height:13px;border-radius:7px;background:#efeff2;margin:12px 0}
#doc mark{color:inherit;border-radius:8px;padding:0 4px;background:linear-gradient(90deg,rgba(11,11,12,.13),rgba(11,11,12,.13)) no-repeat 0 0/0% 100%}
#ans{display:flex;align-items:center;gap:14px;padding:20px 28px;border-radius:34px;background:#0b0b0c;color:#fff;font-weight:500;font-size:28px;box-shadow:0 24px 50px -20px rgba(11,11,12,.5)}
#ans svg{width:30px;height:30px;color:#fff}

/* memory */
#mem{width:860px;height:560px;border-radius:56px;padding:40px}
#mem .hd{display:flex;align-items:center;gap:16px}
#mem .hd b{font-weight:600;font-size:38px;letter-spacing:-.03em}
.mrow{display:flex;align-items:center;gap:24px;margin-top:26px;padding:26px 30px;border-radius:34px;background:rgba(255,255,255,.66);box-shadow:0 10px 30px -18px rgba(11,11,12,.35)}
.mrow .mic2{width:72px;height:72px;border-radius:36px;background:#f0f0f2;display:grid;place-items:center;flex:none}
.mrow span{font-weight:500;font-size:34px;letter-spacing:-.02em}
.mrow .ck{margin-left:auto;width:48px;height:48px;border-radius:24px;background:#0b0b0c;display:grid;place-items:center}
#sig{width:860px;padding:34px 40px}
#sig .ln{font-size:31px;line-height:1.5;color:var(--ink2)}
#sig .nm{font-weight:600;color:var(--ink);font-size:36px}
#sig .cr{display:inline-block;width:3px;height:36px;background:var(--violet);vertical-align:-6px;margin-left:3px}
#drop{border-radius:50%}

/* routine */
.tog{width:118px;height:70px;border-radius:35px;background:rgba(11,11,12,.12);position:relative;flex:none;margin-left:auto}
.tog i{position:absolute;left:6px;top:6px;width:58px;height:58px;border-radius:29px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.sun{width:96px;height:96px;border-radius:48px;background:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -12px rgba(11,11,12,.4);flex:none}

/* telegram */
#tgc{width:880px;height:1000px}
.av{width:64px;height:64px;border-radius:32px;display:grid;place-items:center;font-weight:600;font-size:28px;flex:none}
.msg{position:absolute;left:40px;display:flex;gap:16px;align-items:flex-end}
.bub{padding:22px 28px;border-radius:32px 32px 32px 10px;background:#fff;box-shadow:0 12px 30px -18px rgba(11,11,12,.35);font-size:31px;line-height:1.3;letter-spacing:-.015em;max-width:620px}
.bub small{display:block;font-weight:600;font-size:22px;margin-bottom:6px;color:var(--muted)}
.bub.bot{background:#f0f0f2}
.bub.bot small{color:#3a3a3d}
.tdots{display:flex;gap:9px;padding:24px 28px;border-radius:32px 32px 32px 10px;background:#f0f0f2}
#rem{position:absolute;left:120px;width:640px;padding:28px 32px;border-radius:36px;background:linear-gradient(170deg,#2a2a2e,#0b0b0c);color:#fff;box-shadow:0 30px 60px -26px rgba(11,11,12,.6)}
#rem small{display:flex;align-items:center;gap:10px;font-weight:500;font-size:24px;opacity:.85}
#rem div{font-weight:500;font-size:32px;margin-top:8px;letter-spacing:-.02em}

/* touch droplet + ripple */
#ring{width:120px;height:120px;border-radius:60px;border:4px solid var(--violet)}

/* end */
#eicon{width:400px;height:400px;border-radius:100px}
#end-wm{position:absolute;left:0;width:1080px;top:1080px;text-align:center;color:#fff;font-weight:600;font-size:150px;letter-spacing:-.055em;line-height:1}
#end-tg{position:absolute;left:0;width:1080px;top:1262px;text-align:center;color:#c4c4cc;font-weight:400;font-size:56px;letter-spacing:-.03em}
#end-cta{position:absolute;left:290px;top:1440px;width:500px;height:120px;border-radius:60px;background:#fff;color:var(--ink);
  font-weight:500;font-size:40px;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:0 18px 40px -16px rgba(0,0,0,.6)}

/* chrome */
#pill{width:520px;height:88px;border-radius:44px;display:flex;align-items:center;padding:0 34px;gap:14px;font-weight:600;font-size:30px;letter-spacing:-.025em}
#pill svg{width:34px;height:34px;flex:none}
#pill .dv{width:2px;height:34px;background:rgba(11,11,12,.15);margin:0 6px}
#roll{height:40px;overflow:hidden;flex:1}
#roll div{height:40px;line-height:40px;font-weight:500;font-size:28px;color:var(--ink2);white-space:nowrap}
#roll div b{font-weight:500;color:var(--violet);margin-right:12px;font-variant-numeric:tabular-nums}
#dock{width:520px;height:64px;border-radius:32px}
#dock i{position:absolute;top:26px;height:12px;border-radius:6px}
.hl{left:96px;top:226px;width:900px;font-weight:500;font-size:96px;line-height:1.04;letter-spacing:-.05em}
.hl .ln{display:block;white-space:nowrap}
.hl .w{display:inline-block;margin-right:.24em}
.hl .w.v{color:#0b0b0c;font-weight:600}
.hl .ln.m{color:#8a8a92}
#grain{position:absolute;inset:0;width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.16;pointer-events:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs id="defs">
  <symbol id="mark" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="12" cy="3" r="2"/><circle cx="12" cy="21" r="2"/><circle cx="3" cy="12" r="2"/><circle cx="21" cy="12" r="2"/><circle cx="5.6" cy="5.6" r="1.7"/><circle cx="18.4" cy="5.6" r="1.7"/><circle cx="5.6" cy="18.4" r="1.7"/><circle cx="18.4" cy="18.4" r="1.7"/><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="7.5" r="1.5"/><circle cx="12" cy="16.5" r="1.5"/><circle cx="7.5" cy="12" r="1.5"/><circle cx="16.5" cy="12" r="1.5"/></g></symbol>
  <symbol id="g-mail" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="m4.5 7.5 7.5 5.5 7.5-5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="g-wa" viewBox="0 0 24 24"><path d="M12 3.2a8.8 8.8 0 0 0-7.6 13.2L3.3 20.7l4.4-1.1A8.8 8.8 0 1 0 12 3.2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8.2c.3-.6.6-.6.9-.6h.6c.2 0 .4 0 .6.5l.7 1.7c.1.3 0 .5-.1.7l-.5.6c-.2.2-.2.4 0 .7.6 1 1.5 1.8 2.6 2.3.3.1.5.1.7-.1l.6-.7c.2-.3.5-.3.8-.2l1.6.8c.3.1.4.3.4.5 0 .9-.6 1.7-1.6 1.9-1 .2-2.7-.2-4.6-1.8-1.6-1.4-2.6-3-2.7-4.3-.1-.9.2-1.6.5-2z" fill="currentColor"/></symbol>
  <symbol id="g-tg" viewBox="0 0 24 24"><path d="M20.5 4.5 3.5 11.2c-.9.4-.9 1 0 1.2l4.3 1.4 1.6 5c.2.6.5.7 1 .3l2.4-2 4.6 3.4c.8.5 1.3.2 1.5-.7l2.9-13.7c.3-1.2-.4-1.7-1.3-1.3z" fill="currentColor"/><path d="m8 13.7 9-5.8-6.9 6.8" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  <symbol id="g-sun" viewBox="0 0 24 24"><path d="M6 15a6 6 0 0 1 12 0z" fill="#0b0b0c"/><path d="M4 17.5h16" stroke="#1d1d1f" stroke-width="1.8" stroke-linecap="round"/><path d="M12 5v2.6M5.6 8.2l1.8 1.6M18.4 8.2l-1.8 1.6M3 13h2M19 13h2" stroke="#0b0b0c" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="g-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="#0b0b0c"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="#0b0b0c" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="g-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z" fill="none" stroke="#0b0b0c" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="g-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="#0b0b0c" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="#0b0b0c" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="g-check" viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<div id="stage">
  <div class="layer" id="bg"></div>
  <div id="grid"></div>
