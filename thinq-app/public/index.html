<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thinq AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='%230b0b0c'%3E%3Ccircle cx='12' cy='3' r='2'/%3E%3Ccircle cx='12' cy='21' r='2'/%3E%3Ccircle cx='3' cy='12' r='2'/%3E%3Ccircle cx='21' cy='12' r='2'/%3E%3Ccircle cx='12' cy='12' r='3.2'/%3E%3Ccircle cx='5.6' cy='5.6' r='1.7'/%3E%3Ccircle cx='18.4' cy='5.6' r='1.7'/%3E%3Ccircle cx='5.6' cy='18.4' r='1.7'/%3E%3Ccircle cx='18.4' cy='18.4' r='1.7'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/base.css">
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="12" cy="3" r="2"/><circle cx="12" cy="21" r="2"/><circle cx="3" cy="12" r="2"/><circle cx="21" cy="12" r="2"/><circle cx="5.6" cy="5.6" r="1.7"/><circle cx="18.4" cy="5.6" r="1.7"/><circle cx="5.6" cy="18.4" r="1.7"/><circle cx="18.4" cy="18.4" r="1.7"/><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="7.5" r="1.5"/><circle cx="12" cy="16.5" r="1.5"/><circle cx="7.5" cy="12" r="1.5"/><circle cx="16.5" cy="12" r="1.5"/></g></symbol>
  <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-mail" viewBox="0 0 16 16"><rect x="2" y="3.5" width="12" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m2.5 4.5 5.5 4 5.5-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-cal" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="i-spark" viewBox="0 0 16 16"><path d="M8 1.5c.5 3.4 3.1 6 6.5 6.5-3.4.5-6 3.1-6.5 6.5-.5-3.4-3.1-6-6.5-6.5 3.4-.5 6-3.1 6.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-check" viewBox="0 0 16 16"><path d="M4.5 8.2 7 10.5l4.5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-menu" viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 16 16"><path d="M2 9.5 3.8 3h8.4L14 9.5V13H2zM2 9.5h3.5l1 1.5h3l1-1.5H14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  </g>
</svg>

<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar" aria-label="Conversations and settings">
    <div class="side-top">
      <a href="/" class="logo"><svg><use href="#mark"/></svg>Thinq AI</a>
      <button class="btn ghost sm block" id="newChat"><svg width="14" height="14"><use href="#i-plus"/></svg>New conversation</button>
    </div>
    <nav class="convos" id="convos" aria-label="Conversations"></nav>
    <div class="side-bottom">
      <section class="conn" id="conn" aria-live="polite"></section>
      <details class="memory" id="memory">
        <summary>Remembered <span id="noteCount" class="count"></span></summary>
        <ul id="notes"></ul>
      </details>
      <section class="account" id="account" aria-label="Your account"></section>
    </div>
  </aside>

  <!-- Chat -->
  <main class="chat">
    <header class="chat-head">
      <button class="icon-btn only-mobile" id="openSide" aria-label="Open sidebar"><svg width="16" height="16"><use href="#i-menu"/></svg></button>
      <h1 id="title">New conversation</h1>
      <button class="pill-btn only-narrow" id="openPanel" aria-label="Open approvals"><svg width="14" height="14"><use href="#i-inbox"/></svg>Approvals <span class="badge" id="badgeTop" hidden></span></button>
    </header>
    <div class="banner" id="banner" hidden></div>
    <div class="messages" id="messages" aria-live="polite">
      <div class="empty" id="empty">
        <div class="orb" aria-hidden="true"><svg width="22" height="22"><use href="#mark"/></svg></div>
        <h2 id="greeting">Good day.</h2>
        <p>Ask about your inbox or calendar, or have Thinq draft replies and invites. Nothing is sent until you approve it.</p>
        <div class="suggestions" id="suggestions">
          <button>Plan my day</button>
          <button>What needs a reply from me?</button>
          <button>Draft replies to my unread emails</button>
          <button>Find 30 minutes with Priya this week</button>
        </div>
      </div>
    </div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Ask Thinq anything about your inbox or calendar…" aria-label="Message"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="Send"><svg width="14" height="14"><use href="#i-send"/></svg></button>
    </form>
    <p class="fine-print">Thinq can make mistakes. It never sends or books anything without your approval.</p>
  </main>

  <!-- Approvals + agenda -->
  <aside class="panel" id="panel" aria-label="Approvals and agenda">
    <div class="panel-head">
      <div class="segmented" role="tablist">
        <button role="tab" aria-selected="true" data-tab="approvals">Approvals <span class="badge" id="badge" hidden></span></button>
        <button role="tab" aria-selected="false" data-tab="agenda">Agenda</button>
      </div>
      <button class="icon-btn only-narrow" id="closePanel" aria-label="Close"><svg width="14" height="14"><use href="#i-x"/></svg></button>
    </div>
    <div class="panel-body" id="tab-approvals"></div>
    <div class="panel-body" id="tab-agenda" hidden></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
</div>

<script src="/app/app.js" type="module"></script>
</body>
</html>
